name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build-package:
    name: Build Windows release ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            cmake_platform: x64
            build_dir: build-release-x64
            artifact_name: C2Implant-windows-x64
            release_zip: C2Implant-windows-x64.zip
            conan_install_args: --build=missing
          - arch: x86
            runner: windows-2022
            cmake_platform: Win32
            build_dir: build-release-x86
            artifact_name: C2Implant-windows-x86
            release_zip: C2Implant-windows-x86.zip
            conan_install_args: --build=missing
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64
            build_dir: build-release-arm64
            artifact_name: C2Implant-windows-arm64
            release_zip: C2Implant-windows-arm64.zip
            conan_install_args: --build=missing;-o;openssl/*:no_asm=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.arch }}-
            conan-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -G "Visual Studio 17 2022" `
            -A "${{ matrix.cmake_platform }}" `
            "-DCONAN_INSTALL_ARGS=${{ matrix.conan_install_args }}"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "${{ matrix.build_dir }}" --config $env:BUILD_TYPE -- /m

      - name: Validate deliverables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedBeacons = @(
            "BeaconDns.exe",
            "BeaconDnsDll.dll",
            "BeaconGithub.exe",
            "BeaconGithubDll.dll",
            "BeaconHttp.exe",
            "BeaconHttpDll.dll",
            "BeaconSmb.exe",
            "BeaconSmbDll.dll",
            "BeaconTcp.exe",
            "BeaconTcpDll.dll"
          )

          $expectedModules = @(
            "AssemblyExec.dll",
            "Cat.dll",
            "ChangeDirectory.dll",
            "Chisel.dll",
            "CimExec.dll",
            "Coff.dll",
            "DcomExec.dll",
            "DotnetExec.dll",
            "Download.dll",
            "EnumerateRdpSessions.dll",
            "EnumerateShares.dll",
            "Evasion.dll",
            "GetEnv.dll",
            "Inject.dll",
            "IpConfig.dll",
            "KerberosUseTicket.dll",
            "KeyLogger.dll",
            "KillProcess.dll",
            "ListDirectory.dll",
            "ListProcesses.dll",
            "MakeToken.dll",
            "MiniDump.dll",
            "MkDir.dll",
            "Netstat.dll",
            "Powershell.dll",
            "PrintWorkingDirectory.dll",
            "PsExec.dll",
            "PwSh.dll",
            "Registry.dll",
            "Remove.dll",
            "Rev2self.dll",
            "Run.dll",
            "ScreenShot.dll",
            "Script.dll",
            "Shell.dll",
            "SpawnAs.dll",
            "SshExec.dll",
            "StealToken.dll",
            "TaskScheduler.dll",
            "Tree.dll",
            "Upload.dll",
            "Whoami.dll",
            "WinRM.dll",
            "WmiExec.dll"
          )

          foreach ($file in $expectedBeacons) {
            if (-not (Test-Path "Release/Beacons/$file")) {
              throw "Missing beacon deliverable: $file"
            }
          }

          foreach ($file in $expectedModules) {
            if (-not (Test-Path "Release/Modules/$file")) {
              throw "Missing module deliverable: $file"
            }
          }

      - name: Stage release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "artifacts/${{ matrix.arch }}"
          Remove-Item -Recurse -Force "artifacts" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage/WindowsBeacons", "$stage/WindowsModules" | Out-Null
          Copy-Item "Release/Beacons/*" "$stage/WindowsBeacons" -Exclude ".gitignore"
          Copy-Item "Release/Modules/*" "$stage/WindowsModules" -Exclude ".gitignore"
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.release_zip }}" -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_zip }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: C2Implant-windows-*
          path: release-assets
          merge-multiple: true

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
          fail_on_unmatched_files: true
          body: Windows beacons and modules for x64, x86, and ARM64

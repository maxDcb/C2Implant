name: ARM64 Manual CI

on:
  workflow_dispatch:

env:
  BUILD_DIR: build-arm64-ci
  BUILD_TYPE: Release
  CONAN_CACHE_KEY: conan-${{ runner.os }}-arm64-${{ hashFiles('conanfile.txt') }}-${{ github.run_id }}
  CONAN_CACHE_RESTORE_KEY: conan-${{ runner.os }}-arm64-${{ hashFiles('conanfile.txt') }}-

permissions:
  contents: read

jobs:
  conan-arm64:
    name: Warm Conan cache on Windows ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: ${{ env.CONAN_CACHE_KEY }}
          restore-keys: |
            ${{ env.CONAN_CACHE_RESTORE_KEY }}
            conan-${{ runner.os }}-arm64-
            conan-${{ runner.os }}-

      - name: Detect Conan build profile
        shell: pwsh
        run: |
          conan profile detect --force

      - name: Create ARM64 Conan host profile
        shell: pwsh
        run: |
          @"
          [settings]
          arch=armv8
          os=Windows
          compiler=msvc
          compiler.version=194
          compiler.runtime=static
          compiler.runtime_type=Release
          compiler.cppstd=23
          build_type=Release
          [conf]
          tools.cmake.cmaketoolchain:generator=Visual Studio 17 2022
          tools.cmake:cmake_program=cmake
          "@ | Set-Content -Path "$env:RUNNER_TEMP/conan_arm64_host_profile" -Encoding ascii

      - name: Conan install ARM64 dependencies
        shell: pwsh
        run: |
          conan install . `
            -of "$env:BUILD_DIR/conan-prewarm" `
            --profile:host "$env:RUNNER_TEMP/conan_arm64_host_profile" `
            --profile:build default `
            --build=missing `
            -o openssl/*:no_asm=True `
            -g CMakeDeps

      - name: Save Conan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2
          key: ${{ env.CONAN_CACHE_KEY }}

  build-test-arm64:
    name: Build and test Windows ARM64
    runs-on: windows-11-arm
    needs: conan-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2
          key: ${{ env.CONAN_CACHE_KEY }}
          restore-keys: |
            ${{ env.CONAN_CACHE_RESTORE_KEY }}
            conan-${{ runner.os }}-arm64-
            conan-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DC2CORE_BUILD_TESTS=ON `
            "-DCONAN_INSTALL_ARGS=--build=missing;-o;openssl/*:no_asm=True"

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --config $env:BUILD_TYPE -- /m

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR --build-config $env:BUILD_TYPE --output-on-failure --timeout 60

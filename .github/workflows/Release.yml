name: CI CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "*"

env:
  BUILD_DIR: build-conan
  BUILD_TYPE: Release
  RELEASE_ZIP: Release.zip

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test Windows deliverables
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -DC2CORE_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --config $env:BUILD_TYPE -- /m

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR --build-config $env:BUILD_TYPE --output-on-failure --timeout 60

      - name: Validate deliverables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $expectedBeacons = @(
            "BeaconDns.exe",
            "BeaconDnsDll.dll",
            "BeaconGithub.exe",
            "BeaconGithubDll.dll",
            "BeaconHttp.exe",
            "BeaconHttpDll.dll",
            "BeaconSmb.exe",
            "BeaconSmbDll.dll",
            "BeaconTcp.exe",
            "BeaconTcpDll.dll"
          )

          $expectedModules = @(
            "AssemblyExec.dll",
            "Cat.dll",
            "ChangeDirectory.dll",
            "Chisel.dll",
            "CimExec.dll",
            "Coff.dll",
            "DcomExec.dll",
            "DotnetExec.dll",
            "Download.dll",
            "EnumerateRdpSessions.dll",
            "EnumerateShares.dll",
            "Evasion.dll",
            "GetEnv.dll",
            "Inject.dll",
            "IpConfig.dll",
            "KerberosUseTicket.dll",
            "KeyLogger.dll",
            "KillProcess.dll",
            "ListDirectory.dll",
            "ListProcesses.dll",
            "MakeToken.dll",
            "MiniDump.dll",
            "MkDir.dll",
            "Netstat.dll",
            "Powershell.dll",
            "PrintWorkingDirectory.dll",
            "PsExec.dll",
            "PwSh.dll",
            "Registry.dll",
            "Remove.dll",
            "Rev2self.dll",
            "Run.dll",
            "ScreenShot.dll",
            "Script.dll",
            "Shell.dll",
            "SpawnAs.dll",
            "SshExec.dll",
            "StealToken.dll",
            "TaskScheduler.dll",
            "Tree.dll",
            "Upload.dll",
            "Whoami.dll",
            "WinRM.dll",
            "WmiExec.dll"
          )

          foreach ($file in $expectedBeacons) {
            if (-not (Test-Path "Release/Beacons/$file")) {
              throw "Missing beacon deliverable: $file"
            }
          }

          foreach ($file in $expectedModules) {
            if (-not (Test-Path "Release/Modules/$file")) {
              throw "Missing module deliverable: $file"
            }
          }

      - name: Stage release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "artifacts/Release"
          Remove-Item -Recurse -Force "artifacts" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage/WindowsBeacons", "$stage/WindowsModules" | Out-Null
          Copy-Item "Release/Beacons/*" "$stage/WindowsBeacons" -Exclude ".gitignore"
          Copy-Item "Release/Modules/*" "$stage/WindowsModules" -Exclude ".gitignore"
          Compress-Archive -Path "$stage/*" -DestinationPath $env:RELEASE_ZIP -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: C2Implant-Windows-Release
          path: ${{ env.RELEASE_ZIP }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: windows-2022
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: C2Implant-Windows-Release

      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.RELEASE_ZIP }}
          asset_name: ${{ env.RELEASE_ZIP }}
          tag: ${{ github.ref }}
          overwrite: true
          body: "Windows beacons and modules"

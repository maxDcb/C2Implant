name: ARM64 Manual CI

on:
  workflow_dispatch:

env:
  BUILD_DIR: build-arm64-ci
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build-test-arm64:
    name: Build and test Windows ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-arm64-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-arm64-
            conan-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B $env:BUILD_DIR `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DC2CORE_BUILD_TESTS=ON `
            "-DCONAN_INSTALL_ARGS=--build=missing;-o;openssl/*:no_asm=True"

      - name: Build
        shell: pwsh
        run: |
          cmake --build $env:BUILD_DIR --config $env:BUILD_TYPE -- /m

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir $env:BUILD_DIR --build-config $env:BUILD_TYPE --output-on-failure --timeout 60
